[project]
name = "earning-vol"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "polars",
    "duckdb",
    "pyarrow",
    "pandas",
    "exchange-calendars",
    "python-dotenv",
    "pyyaml",
    "requests>=2.34.2",
    "ivolatility>=1.9.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earning_vol"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
